{% set name = "cfgrib" %}
{% set version = "0.9.15.1" %}
{% set eccodes_version = "2.48.0" %}
{% set python_eccodes_version = "2.48.0" %}
{% set findlibs_version = "0.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: d959d8b97e55a63646fa86686b297905ff7f2918a91e3a11d6292dab09598e4d
  - url: https://confluence.ecmwf.int/download/attachments/45757960/eccodes-{{ eccodes_version }}-Source.tar.gz
    sha256: 62e8fa5ca137d138189a5fdd6d5b2205c89cc26338e3f4286aba3d89b49c9f9a
    folder: eccodes
  - url: https://github.com/ecmwf/eccodes-python/archive/{{ python_eccodes_version }}.tar.gz
    sha256: 383c615588526f8f65497cabc915e54a6422b76626f6eed46820efaa9b9906f0
    folder: python-eccodes
  - url: https://pypi.io/packages/source/f/findlibs/findlibs-{{ findlibs_version }}.tar.gz
    sha256: 49bbe509c8b439ecd9c0d021c301aa9db643a2e6ab4e189a40b505ee4a49db62
    folder: findlibs

build:
  number: 0
  skip: true  # [py<310]
  detect_binary_files_with_prefix: true
  entry_points:
    - cfgrib = cfgrib.__main__:cfgrib_cli

requirements:
  build:
    - {{ compiler('fortran') }}  # [not win]
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - git  # [not win]
    - make  # [not win]
    - msys2-bash  # [win]
  host:
    - cffi ==2.1.1
    - numpy
    - pip
    - pytest-runner ==6.0.0
    - python
    - setuptools
    - setuptools-scm >=8
    - wheel
    # eccodes C library host deps
    - hdf5
    - jasper
    - libaec
    - libjpeg-turbo ==3.1.3
    - libnetcdf
    - libpng
    - zlib
  run:
    - attrs >=19.2
    - cffi
    - click
    - numpy
    - packaging
    - python
    - xarray >=0.15

test:
  requires:
    - pip
  imports:
    - cf2cdm
    - cfgrib
    - eccodes
    - findlibs
    - gribapi
  commands:
    - pip check
    - cfgrib --help
    - codes_info

about:
  home: https://github.com/ecmwf/cfgrib
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Maps GRIB files to the NetCDF Common Data Model with CF Convention using ecCodes
  description: |
    cfgrib is a Python library that provides high-level access to GRIB files via the ECMWF ecCodes
    library. It maps GRIB data to the NetCDF Common Data Model following CF Conventions and can
    serve as an xarray backend engine for reading GRIB files directly into xarray datasets.

    This package bundles eccodes (C library), python-eccodes, and findlibs.
  dev_url: https://github.com/ecmwf/cfgrib
  doc_url: https://github.com/ecmwf/cfgrib

extra:
  skip-lints:
    - version_constraints_missing_whitespace
  anaconda-services:
    ref:
      - https://anaconda.zendesk.com/agent/tickets/109074
  recipe-maintainers:
    - amaloney
